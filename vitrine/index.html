<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Un commerce sur Mon Djê</title>
  <link rel="icon" href="../favicon.png" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* Cette page se lit sur le téléphone d'un client, pas sur un bureau. Fond
       clair : elle s'ouvre souvent dehors, en plein soleil. */
    body { background: #f5f7fb; color: #10131a; }
    .vitrine { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
    .enseigne { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .enseigne img {
      width: 68px; height: 68px; object-fit: contain;
      background: #fff; border-radius: 14px; padding: 6px; border: 1px solid #e2e6ef;
    }
    .enseigne h1 { margin: 0; font-size: 26px; }
    .lieu { color: #5b6579; margin: 0 0 18px; }
    .appel {
      display: block; text-align: center; text-decoration: none;
      background: #25d366; color: #073b1c; font-weight: 700;
      padding: 15px; border-radius: 12px; margin-bottom: 10px; font-size: 17px;
    }
    .appel.tel { background: #f4a300; color: #10131a; }
    /* Chaque bloc dit ce qu'il est. Sans titre, l'affiche d'un concert et la
       photo d'un plat se ressemblent : le client ne sait pas ce qu'il regarde. */
    .titre-bloc {
      margin: 22px 0 8px; font-size: 15px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em; color: #10131a;
    }

    /* Une affiche porte du texte — un numéro, une date, un prix. Sur un
       téléphone, elle n'est lisible qu'en grand. */
    .annonce img, .photo img { cursor: zoom-in; }
    .loupe {
      position: fixed; inset: 0; z-index: 50; display: flex;
      align-items: center; justify-content: center;
      background: rgba(6, 9, 15, .92); padding: 16px;
    }
    .loupe img { max-width: 100%; max-height: 88vh; border-radius: 8px; }
    .loupe figcaption {
      color: #f5f7fb; text-align: center; margin-top: 12px; font-size: 16px;
    }
    .loupe .fermer {
      position: absolute; top: 10px; right: 14px; color: #f5f7fb;
      font-size: 34px; line-height: 1; background: none; border: 0; padding: 8px;
    }
    .cache { display: none; }

    /* L'annonce du commerce. Elle se voit sans crier : une bordure et un fond
       chaud suffisent sur une page par ailleurs blanche. */
    .annonce {
      background: #fff8e8; border: 1px solid #f0d089; border-radius: 12px;
      padding: 14px 16px; margin: 18px 0 6px;
    }
    .annonce img {
      display: block; width: 100%; border-radius: 8px; margin-bottom: 10px;
    }
    .annonce p { margin: 0; font-size: 17px; line-height: 1.45; white-space: pre-line; }
    /* Les photos du commerce. Deux par ligne sur un téléphone : assez grandes
       pour donner envie, assez petites pour qu'on en voie plusieurs d'un coup. */
    .photos {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 6px;
    }
    .photo {
      /* Un <figure> porte 40 px de marge de chaque cote par defaut : sans ce
         zero, la carte ne remplit pas sa colonne. */
      margin: 0;
      background: #fff; border: 1px solid #e2e6ef; border-radius: 10px; overflow: hidden;
    }
    .photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .photo figcaption { padding: 8px 10px; font-size: 14px; }
    .rayon { margin: 26px 0 8px; font-size: 13px; text-transform: uppercase;
             letter-spacing: .04em; color: #5b6579; }
    .article {
      display: flex; justify-content: space-between; gap: 12px;
      background: #fff; border: 1px solid #e2e6ef; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 8px;
    }
    .article .unite { color: #5b6579; font-size: 13px; }
    .article .prix { font-weight: 700; white-space: nowrap; }
    .pied { margin-top: 32px; text-align: center; color: #5b6579; font-size: 13px; }
    .pied img { width: 26px; vertical-align: middle; margin-right: 6px; }
    .apropos { margin-top: 10px; text-align: center; font-size: 14px; color: #5b6579; }
    .apropos summary { cursor: pointer; display: inline-block; padding: 8px 14px; border: 1px solid #e2e6ef; border-radius: 999px; background: #fff; }
    .apropos > div, .apropos > p { text-align: left; }
    .apropos .credits details { background: #fff; border: 1px solid #e2e6ef; border-radius: 12px; padding: 2px 14px; margin: 8px 0; }
    .apropos .credits summary { border: 0; border-radius: 0; background: none; display: block; padding: 10px 0; color: #10131a; }
    .apropos .credits summary b { display: block; }
    .apropos .credits summary small { display: block; color: #5b6579; }
    .apropos .credits h4 { margin: 10px 0 2px; font-size: 14px; color: #10131a; }
    .apropos .credits ul { margin: 0 0 8px; padding-left: 18px; }
    .apropos .credit-auteur { margin: 12px 0 6px; }
    .apropos .credit-auteur span { display: block; font-size: 12px; }
    .attente { text-align: center; color: #5b6579; padding: 60px 0; }

    /* Réserver, participer à un événement, commander un plat : tout finit sur le WhatsApp du commerce.
       La page ne garde rien : elle prépare un message, le client l'envoie lui-même. */
    .appel.reserver { background: #1a5fa8; color: #fff; border: 0; width: 100%; font-family: inherit; cursor: pointer; }
    .annonce.cliquable { cursor: pointer; }
    .indice { margin: 8px 0 0; font-size: 13px; color: #5b6579; }
    .cmd {
      display: block; padding: 7px 10px; background: #e7f6ee; color: #14572f; font-size: 13px; font-weight: 700;
      text-align: center; border-top: 1px solid #cfe9da;
    }
    .photo.cliquable { cursor: pointer; }
    .modale {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 9, 15, .6); padding: 16px; overflow-y: auto;
    }
    .carte-modale {
      background: #fff; border-radius: 16px; padding: 20px 18px; width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }
    .carte-modale h2 { margin: 0 0 6px; font-size: 20px; }
    .carte-modale p { margin: 0 0 12px; color: #5b6579; }
    .carte-modale .affiche { display: block; width: 100%; max-height: 46vh; object-fit: contain; border-radius: 10px; margin-bottom: 10px; background: #f5f7fb; }
    .carte-modale .phrase { color: #10131a; font-size: 16px; white-space: pre-line; }
    .carte-modale label { display: block; margin: 0 0 12px; font-weight: 700; font-size: 14px; }
    .carte-modale input {
      display: block; width: 100%; margin-top: 4px; padding: 12px; font: inherit; font-weight: 400;
      border: 1px solid #c9d0de; border-radius: 10px; background: #fff; color: #10131a;
    }
    .carte-modale .erreur { color: #b3261e; font-size: 14px; min-height: 18px; margin: 0 0 8px; }
    .actions-modale { display: flex; gap: 10px; margin-top: 6px; }
    .actions-modale button {
      flex: 1; padding: 14px; font: inherit; font-weight: 700; border: 0; border-radius: 12px; cursor: pointer;
    }
    .actions-modale .non { background: #e9edf5; color: #10131a; }
    .actions-modale .oui { background: #25d366; color: #073b1c; }
  </style>
</head>
<body>
  <!-- La page d'un commerce, lisible sans compte. Elle ne montre que ce que le
       propriétaire a ouvert : sa page entière, et ses prix séparément. -->
  <div class="loupe cache" id="loupe">
    <button class="fermer" id="fermerLoupe" aria-label="Fermer">&times;</button>
    <figure style="margin:0">
      <img id="loupeImage" alt="" />
      <figcaption id="loupeLegende"></figcaption>
    </figure>
  </div>

  <!-- La fenêtre des demandes (réservation, événement) : son contenu est posé par vitrine.js -->
  <div class="modale cache" id="modale" role="dialog" aria-modal="true">
    <div class="carte-modale" id="modaleCorps"></div>
  </div>

  <div class="vitrine" id="vitrine">
    <p class="attente">Un instant…</p>
  </div>

  <script src="../vendor/supabase.js"></script>
  <script src="vitrine.js"></script>
</body>
</html>
