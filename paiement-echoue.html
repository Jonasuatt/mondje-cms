<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paiement interrompu — Mon Djê</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Wave renvoie ici quand le paiement n'aboutit pas. Rien n'est prélevé :
       il faut le dire clairement, sinon le commerçant croit avoir payé. -->
  <div class="connexion">
    <div class="carte connexion-carte" style="border-color: var(--accent)">
      <h1>Paiement interrompu</h1>
      <p class="sous">Mon Djê</p>
      <p>
        Rien n'a été prélevé sur ton compte Wave.
      </p>
      <p class="info">
        Retourne dans l'application Mon Djê et recommence. Si cela se répète,
        écris-nous depuis « Assistance Mon Djê » ou appelle le 05 05 52 27 76.
      </p>
    </div>
  </div>
</body>
</html>
