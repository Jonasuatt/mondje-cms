<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paiement reçu — Mon Djê</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Wave renvoie ici après un paiement réussi. Le commerçant est dans son
       navigateur : il doit juste savoir que c'est bon et retourner dans
       l'application, où son abonnement s'est déjà prolongé. -->
  <div class="connexion">
    <div class="carte connexion-carte" style="border-color: var(--ok)">
      <img class="logo" src="logo-mondje.png" alt="" width="72" height="72" />
      <h1>Paiement reçu</h1>
      <p class="sous">Mon Djê</p>
      <p>
        Merci. Ton abonnement est réglé.
      </p>
      <p class="info">
        Retourne dans l'application Mon Djê : ton espace est ouvert. Si
        l'échéance n'a pas encore bougé, touche « J'ai payé — vérifier ».
      </p>
    </div>
  </div>
</body>
</html>
